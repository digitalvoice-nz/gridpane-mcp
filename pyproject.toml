[project]
name = "gridpane-mcp"
version = "0.4.0"
description = "MCP server and command-line client for the documented GridPane hosting API: sites, caches, tagged backups, restores and WP-CLI."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    { name = "Fenil Patel", email = "fenil@supple.com.au" },
]
keywords = ["mcp", "gridpane", "wordpress", "hosting", "model-context-protocol"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Internet :: WWW/HTTP :: Site Management",
    "Topic :: System :: Systems Administration",
]
dependencies = [
    "anyio>=4.0",
    "httpx>=0.27.0",
    "mcp[cli]>=1.2.0,<2",
    "truststore>=0.9",
]

[project.urls]
Homepage = "https://github.com/digitalvoice-nz/gridpane-mcp"
Repository = "https://github.com/digitalvoice-nz/gridpane-mcp"
Issues = "https://github.com/digitalvoice-nz/gridpane-mcp/issues"

[project.scripts]
gridpane-mcp = "gridpane_mcp.server:main"
gridpane = "gridpane_mcp.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
